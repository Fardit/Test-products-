<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <title>Fardit Ahamed | 3D Portfolio</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';

        import { OrbitControls } from
            'three/addons/controls/OrbitControls.js';

        import { FontLoader } from
            'three/addons/loaders/FontLoader.js';


        let camera;
        let scene;
        let renderer;


        // ==========================================
        // INITIALIZE
        // ==========================================

        init();


        function init() {

            // ==========================================
            // CAMERA
            // ==========================================

            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                1,
                10000
            );

            camera.position.set(
                0,
                -250,
                700
            );


            // ==========================================
            // SCENE
            // ==========================================

            scene = new THREE.Scene();

            scene.background =
                new THREE.Color(0xf0f0f0);


            // ==========================================
            // LOAD FONT
            // ==========================================

            const loader = new FontLoader();

            loader.load(

                'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/fonts/helvetiker_regular.typeface.json',

                function (font) {

                    createText(font);

                },

                undefined,

                function (error) {

                    console.error(
                        'Font loading error:',
                        error
                    );

                }
            );


            // ==========================================
            // RENDERER
            // ==========================================

            renderer = new THREE.WebGLRenderer({
                antialias: true
            });

            renderer.setPixelRatio(
                window.devicePixelRatio
            );

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            document.body.appendChild(
                renderer.domElement
            );


            // ==========================================
            // ORBIT CONTROLS
            // ==========================================

            const controls = new OrbitControls(
                camera,
                renderer.domElement
            );

            controls.target.set(
                0,
                0,
                0
            );

            controls.enableDamping = true;

            controls.dampingFactor = 0.05;

            controls.update();

            controls.addEventListener(
                'change',
                render
            );


            // ==========================================
            // WINDOW RESIZE
            // ==========================================

            window.addEventListener(
                'resize',
                onWindowResize
            );


            render();

        }


        // ==========================================
        // CREATE TEXT
        // ==========================================

        function createText(font) {

            const color = 0x006699;


            // ==========================================
            // TEXT MATERIAL
            // ==========================================

            const matLite =
                new THREE.MeshBasicMaterial({

                    color: color,

                    transparent: true,

                    opacity: 0.7,

                    side: THREE.DoubleSide

                });


            // ==========================================
            // YOUR NAME
            // ==========================================

            const message =
                'Fardit Ahamed';


            // ==========================================
            // GENERATE TEXT SHAPES
            // ==========================================

            const shapes =
                font.generateShapes(
                    message,
                    100
                );


            // ==========================================
            // TEXT GEOMETRY
            // ==========================================

            const geometry =
                new THREE.ShapeGeometry(
                    shapes
                );

            geometry.computeBoundingBox();


            // ==========================================
            // CENTER TEXT
            // ==========================================

            const xMid =
                -0.5 *
                (
                    geometry.boundingBox.max.x -
                    geometry.boundingBox.min.x
                );


            geometry.translate(
                xMid,
                0,
                0
            );


            // ==========================================
            // TEXT MESH
            // ==========================================

            const text =
                new THREE.Mesh(
                    geometry,
                    matLite
                );

            text.position.z = -150;

            scene.add(text);


            // ==========================================
            // OUTLINE MATERIAL
            // ==========================================

            const matDark =
                new THREE.LineBasicMaterial({

                    color: color,

                    side: THREE.DoubleSide

                });


            // ==========================================
            // FIND HOLES
            // ==========================================

            const holeShapes = [];


            for (
                let i = 0;
                i < shapes.length;
                i++
            ) {

                const shape =
                    shapes[i];


                if (
                    shape.holes &&
                    shape.holes.length > 0
                ) {

                    for (
                        let j = 0;
                        j < shape.holes.length;
                        j++
                    ) {

                        holeShapes.push(
                            shape.holes[j]
                        );

                    }

                }

            }


            shapes.push(
                ...holeShapes
            );


            // ==========================================
            // CREATE OUTLINE
            // ==========================================

            const lineText =
                new THREE.Object3D();


            for (
                let i = 0;
                i < shapes.length;
                i++
            ) {

                const shape =
                    shapes[i];


                const points =
                    shape.getPoints();


                const lineGeometry =
                    new THREE.BufferGeometry()
                        .setFromPoints(points);


                lineGeometry.translate(
                    xMid,
                    0,
                    0
                );


                const lineMesh =
                    new THREE.Line(
                        lineGeometry,
                        matDark
                    );


                lineText.add(
                    lineMesh
                );

            }


            scene.add(lineText);


            render();

        }


        // ==========================================
        // WINDOW RESIZE
        // ==========================================

        function onWindowResize() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            render();

        }


        // ==========================================
        // RENDER
        // ==========================================

        function render() {

            renderer.render(
                scene,
                camera
            );

        }

    </script>

</body>

</html>
